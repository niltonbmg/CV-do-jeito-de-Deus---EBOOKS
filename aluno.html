<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área do Aluno — Do Rei Soluções</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topo">
  <div class="container nav">
    <a href="index.html" class="logo">Do Rei <span>Soluções</span></a>
    <nav>
      <a href="index.html">Portal</a>
      <a href="index.html#assinatura">Assinatura</a>
      <button id="sair" class="btn btn-sec btn-peq oculto">Sair</button>
    </nav>
  </div>
</header>

<main class="container">
  <form id="formLogin" class="login">
    <h2>Área do Aluno</h2>
    <input name="email" type="email" placeholder="Seu e-mail" required>
    <input name="codigo" placeholder="Código de acesso" required>
    <button class="btn" type="submit">Entrar</button>
    <p id="erroLogin" class="aviso oculto" style="color:#f87171">E-mail ou código inválido.</p>
    <p class="aviso">Ainda não é assinante? <a class="link" href="index.html#assinatura">Assine por R$ 79,90/mês</a></p>
  </form>

  <section id="painel" class="secao oculto">
    <div class="barra">
      <h2>Olá, <span id="nomeAluno"></span></h2>
      <span class="tag">Assinatura ativa · R$ 79,90/mês</span>
    </div>
    <div class="grade" id="gradeCursos"></div>
  </section>

  <section id="curso" class="secao oculto">
    <a href="#" id="voltar" class="link">← Meus cursos</a>
    <h2 id="tituloCurso" style="text-align:left;margin-top:16px"></h2>
    <div class="progresso"><div id="barraCurso"></div></div>
    <ul class="aulas" id="listaAulas"></ul>
  </section>
</main>

<script src="aluno.js"></script>
</body>
</html>
